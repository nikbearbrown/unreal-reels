<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="{DS_CSS}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<style>
  html,body{{margin:0;padding:0;background:#000;}}
  .katex{{font-size:1em;}}
  @keyframes nu-rise{{from{{opacity:0;transform:translateY(22px);}}to{{opacity:1;transform:none;}}}}
  @media (prefers-reduced-motion:no-preference){{
    [data-deck-active] .rise{{animation:nu-rise .55s var(--ease-default) both;}}
    [data-deck-active] .rise2{{animation:nu-rise .55s var(--ease-default) .12s both;}}
    [data-deck-active] .rise3{{animation:nu-rise .55s var(--ease-default) .24s both;}}
  }}
</style>
</helmet>
<x-import component-from-global-scope="deck-stage" from="./deck-stage.js" width="1920" height="1080" hint-size="100%,100%">

{SLIDES}

{CHART_SCRIPT}
</body>
</html>
